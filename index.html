<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Store & Tutorials</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0c0a09;
            --card-bg: #1c1917;
            --brown-primary: #8b4513;
            --brown-hover: #a0522d;
            --brown-accent: #d2691e;
            --text-color: #f5f5f5;
            --text-muted: #a8a29e;
            --border-color: #44403c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Header */
        header {
            background: linear-gradient(180deg, #1c1917 0%, #0c0a09 100%);
            border-bottom: 2px solid var(--brown-primary);
            padding: 20px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: #fff;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header h1 span {
            color: var(--brown-accent);
        }

        /* Top Bar / Admin Trigger */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 15px auto;
            padding: 0 10px;
        }

        .admin-status {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-admin {
            background-color: var(--brown-primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-admin:hover {
            background-color: var(--brown-hover);
        }

        /* Category Tabs Grid */
        .categories-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .cat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cat-card:hover, .cat-card.active {
            border-color: var(--brown-accent);
            background-color: #292524;
            transform: translateY(-3px);
        }

        .cat-card i {
            font-size: 2rem;
            color: var(--brown-accent);
            margin-bottom: 10px;
        }

        .cat-card h3 {
            font-size: 1.1rem;
            color: #fff;
        }

        /* Section Container */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.4rem;
            color: var(--brown-accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add {
            background-color: #16a34a;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: none; /* Controlled by admin state */
        }

        /* Card Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .media-box {
            width: 100%;
            height: 180px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .media-box img, .media-box iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .card-price {
            font-size: 1.1rem;
            color: #22c55e;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn-wa {
            flex-grow: 1;
            background-color: #25d366;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-delete {
            background-color: #dc2626;
            color: #fff;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: none; /* Controlled by admin state */
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--brown-primary);
            width: 100%;
            max-width: 450px;
            border-radius: 10px;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #0c0a09;
            color: #fff;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--brown-primary);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Floating WhatsApp Button */
        .float-wa {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: #fff;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-decoration: none;
            z-index: 99;
        }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <span class="admin-status" id="adminStatus">User Mode</span>
            <button class="btn-admin" onclick="toggleAdminModal()"><i class="fa-solid fa-lock"></i> Admin Login</button>
        </div>
        <h1>Panel <span>Store & Hub</span></h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Official Free & Paid Panels and Tutorials</p>
    </header>

    <!-- 4 Main Options -->
    <div class="categories-container">
        <div class="cat-card active" onclick="filterCategory('free')">
            <i class="fa-solid fa-gift"></i>
            <h3>Free Panel</h3>
        </div>
        <div class="cat-card" onclick="filterCategory('paid')">
            <i class="fa-solid fa-crown"></i>
            <h3>Paid Panel</h3>
        </div>
        <div class="cat-card" onclick="filterCategory('making')">
            <i class="fa-solid fa-code"></i>
            <h3>Panel Making Tutorial</h3>
        </div>
        <div class="cat-card" onclick="filterCategory('unban')">
            <i class="fa-solid fa-shield-halved"></i>
            <h3>FF ID Ban Tutorial</h3>
        </div>
    </div>

    <!-- Main Content Section -->
    <div class="main-content">
        <div class="section-header">
            <h2 class="section-title" id="currentSectionTitle"><i class="fa-solid fa-gift"></i> Free Panels</h2>
            <button class="btn-add" id="btnAddPost" onclick="openPostModal()"><i class="fa-solid fa-plus"></i> Add Content</button>
        </div>

        <div class="cards-grid" id="cardsContainer">
            <!-- Cards will load dynamically via JS -->
        </div>
    </div>

    <!-- Floating WhatsApp Icon -->
    <a href="https://wa.me/923405048439" target="_blank" class="float-wa">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Admin Password Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Admin Login</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('adminModal')"></i>
            </div>
            <div class="form-group">
                <label>Enter Admin Password:</label>
                <input type="password" id="adminPasswordInput" placeholder="Password daalein">
            </div>
            <button class="btn-submit" onclick="verifyAdmin()">Login</button>
        </div>
    </div>

    <!-- Add Post Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Content</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('postModal')"></i>
            </div>
            <form id="postForm" onsubmit="handleSavePost(event)">
                <div class="form-group">
                    <label>Category</label>
                    <select id="postCategory">
                        <option value="free">Free Panel</option>
                        <option value="paid">Paid Panel</option>
                        <option value="making">Panel Making Tutorial</option>
                        <option value="unban">FF ID Ban Tutorial</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="postTitle" placeholder="Title daalein" required>
                </div>
                <div class="form-group">
                    <label>Price (For Paid Panels Only)</label>
                    <input type="text" id="postPrice" placeholder="e.g. 500 PKR / Free">
                </div>
                <div class="form-group">
                    <label>Media Type</label>
                    <select id="mediaType">
                        <option value="image">Image URL</option>
                        <option value="video">YouTube Video URL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Media URL (Image or YouTube Link)</label>
                    <input type="url" id="postMediaUrl" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="postDesc" rows="3" placeholder="Detail likhein..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Upload Content</button>
            </form>
        </div>
    </div>

    <script>
        const WA_NUMBER = "923405048439";
        let isAdmin = false;
        let currentCategory = "free";

        // Initial Data Setup
        let itemsData = JSON.parse(localStorage.getItem("panel_items_data")) || [
            { id: 1, category: "free", title: "Free Aimlock Panel", price: "Free", type: "image", url: "https://via.placeholder.com/400x200/8b4513/ffffff?text=Free+Panel", desc: "100% Free Headshot Panel for all Android devices." },
            { id: 2, category: "paid", title: "VIP Injector Panel", price: "1000 PKR", type: "image", url: "https://via.placeholder.com/400x200/1c1917/d2691e?text=VIP+Paid+Panel", desc: "Anti-Ban Safe Main Account Panel with auto updates." },
            { id: 3, category: "making", title: "How to Make FF Panel", price: "Tutorial", type: "video", url: "https://www.youtube.com/embed/dQw4w9WgXcQ", desc: "Complete step-by-step tutorial on panel making." },
            { id: 4, category: "unban", title: "FF ID Unban Trick 2026", price: "Guide", type: "video", url: "https://www.youtube.com/embed/dQw4w9WgXcQ", desc: "Learn how to unban your banned Free Fire ID safely." }
        ];

        function saveData() {
            localStorage.setItem("panel_items_data", JSON.stringify(itemsData));
        }

        // Render Cards
        function renderCards() {
            const container = document.getElementById("cardsContainer");
            container.innerHTML = "";

            const filtered = itemsData.filter(item => item.category === currentCategory);

            if(filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted); margin-top: 30px;">Is category mein abhi koi content nahi hai.</p>`;
                return;
            }

            filtered.forEach(item => {
                let mediaHtml = "";
                if(item.type === "video") {
                    let embedUrl = item.url;
                    if(embedUrl.includes("watch?v=")) {
                        embedUrl = embedUrl.replace("watch?v=", "embed/");
                    }
                    mediaHtml = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
                } else {
                    mediaHtml = `<img src="${item.url}" alt="${item.title}">`;
                }

                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div class="media-box">${mediaHtml}</div>
                    <div class="card-body">
                        <div>
                            <div class="card-title">${item.title}</div>
                            <div class="card-desc">${item.desc}</div>
                        </div>
                        <div>
                            ${item.price ? `<div class="card-price">${item.price}</div>` : ''}
                            <div class="card-actions">
                                <a href="https://wa.me/${WA_NUMBER}?text=Hello%20mujhe%20${encodeURIComponent(item.title)}%20ke%20bary%20mein%20info%20chahiye" target="_blank" class="btn-wa">
                                    <i class="fa-brands fa-whatsapp"></i> WhatsApp Contact
                                </a>
                                <button class="btn-delete" style="display: ${isAdmin ? 'block' : 'none'};" onclick="deleteItem(${item.id})">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Category Filter
        function filterCategory(cat) {
            currentCategory = cat;
            
            // Highlight Tab
            const tabs = document.querySelectorAll(".cat-card");
            tabs.forEach(tab => tab.classList.remove("active"));
            
            const titles = {
                'free': '<i class="fa-solid fa-gift"></i> Free Panels',
                'paid': '<i class="fa-solid fa-crown"></i> Paid Panels',
                'making': '<i class="fa-solid fa-code"></i> Panel Making Tutorials',
                'unban': '<i class="fa-solid fa-shield-halved"></i> FF ID Unban Tutorials'
            };

            document.getElementById("currentSectionTitle").innerHTML = titles[cat];
            
            // Add active class to clicked category
            event.currentTarget.classList.add("active");
            renderCards();
        }

        // Admin Management
        function toggleAdminModal() {
            if(isAdmin) {
                isAdmin = false;
                document.getElementById("adminStatus").innerText = "User Mode";
                document.querySelector(".btn-admin").innerHTML = `<i class="fa-solid fa-lock"></i> Admin Login`;
                document.getElementById("btnAddPost").style.display = "none";
                renderCards();
            } else {
                document.getElementById("adminModal").style.display = "flex";
            }
        }

        function verifyAdmin() {
            const pass = document.getElementById("adminPasswordInput").value;
            // Admin password condition (03405048439 or admin)
            if(pass === "03405048439" || pass === "admin") {
                isAdmin = true;
                document.getElementById("adminStatus").innerText = "Admin Unlocked";
                document.querySelector(".btn-admin").innerHTML = `<i class="fa-solid fa-lock-open"></i> Logout Admin`;
                document.getElementById("btnAddPost").style.display = "block";
                closeModal("adminModal");
                document.getElementById("adminPasswordInput").value = "";
                renderCards();
            } else {
                alert("Galt Password!");
            }
        }

        function openPostModal() {
            document.getElementById("postCategory").value = currentCategory;
            document.getElementById("postModal").style.display = "flex";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function handleSavePost(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                category: document.getElementById("postCategory").value,
                title: document.getElementById("postTitle").value,
                price: document.getElementById("postPrice").value,
                type: document.getElementById("mediaType").value,
                url: document.getElementById("postMediaUrl").value,
                desc: document.getElementById("postDesc").value
            };

            itemsData.unshift(newItem);
            saveData();
            closeModal("postModal");
            document.getElementById("postForm").reset();
            renderCards();
        }

        function deleteItem(id) {
            if(confirm("Kya aap is content ko delete karna chahte hain?")) {
                itemsData = itemsData.filter(item => item.id !== id);
                saveData();
                renderCards();
            }
        }

        // Initial Load
        renderCards();
    </script>
</body>
</html>
